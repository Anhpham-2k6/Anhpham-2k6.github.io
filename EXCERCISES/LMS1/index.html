<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 2</title>
</head>
<body>

<script>
let n = prompt("Nhập một số:");

if (n === null || n === "" || isNaN(n)) {
    document.write("<p style='color:red'>Bạn phải nhập số!</p>");
} 
else if (n % 2 == 0) {
    document.write("<p style='color:green'><b>" + n + " là số chẵn</b></p>");
} 
else {
    document.write("<p style='color:blue'><i>" + n + " là số lẻ</i></p>");
}
</script>

</body>
</html>
